[project]
name = "justra-rag"
version = "0.1.0"
description = "Hybrid legal RAG backend for Justra"
readme = "READMERAG.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "flask>=3.1.0",
  "flask-cors>=5.0.0",
  "langchain>=0.3.26",
  "langchain-community>=0.3.26",
  "langchain-ollama>=0.3.6",
  "neo4j>=5.28.2",
  "ollama>=0.6.0",
  "pgvector>=0.4.1",
  "pydantic>=2.11.3",
  "pymupdf>=1.26.4",
  "python-dotenv>=1.1.1",
  "rank-bm25>=0.2.2",
  "supabase>=2.15.3",
  "tiktoken>=0.11.0",
  "tqdm>=4.67.1",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.uv]
package = false
